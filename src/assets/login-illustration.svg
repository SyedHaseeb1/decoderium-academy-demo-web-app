<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="100%" height="100%" fill="none">
  <defs>
    <!-- Decoderium Brand Gradients -->
    <linearGradient id="decArchGrad" x1="250" y1="80" x2="250" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="decBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582be8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="decPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4760"/>
      <stop offset="100%" stop-color="#e60057"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="200" y1="400" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="200" y1="370" x2="290" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#582be8" flood-opacity="0.12"/>
    </filter>
    <filter id="floatBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#582be8" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ground Floor Shadow in Soft Violet -->
  <ellipse cx="250" cy="550" rx="190" ry="18" fill="#e2e8f0" opacity="0.7"/>

  <!-- Main Decoderium Pastel Violet Archway -->
  <path d="M 90 560 L 90 230 A 160 160 0 0 1 410 230 L 410 560 Z" fill="url(#decArchGrad)"/>

  <!-- Inner Arch Accent Rim -->
  <path d="M 105 560 L 105 235 A 145 145 0 0 1 395 235 L 395 560" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.6" fill="none"/>

  <!-- Floating Ambient Medical Badge: Heartbeat CME -->
  <g filter="url(#floatBadgeShadow)" transform="translate(50, 160)">
    <rect width="112" height="38" rx="19" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <circle cx="20" cy="19" r="12" fill="#fff1f2"/>
    <path d="M 14 19 L 17 19 L 19 14 L 21 24 L 23 18 L 25 19 L 27 19" stroke="#ff4760" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="38" y="23" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">CME 12h</text>
  </g>

  <!-- Floating Ambient Learning Badge: Verified -->
  <g filter="url(#floatBadgeShadow)" transform="translate(340, 200)">
    <rect width="116" height="38" rx="19" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <circle cx="20" cy="19" r="12" fill="#ede9fe"/>
    <path d="M 15 19 L 18 22 L 25 15" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="38" y="23" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">PMDC Lic.</text>
  </g>

  <!-- Spark Stars in Sky Blue & Magenta -->
  <path d="M 380 120 Q 380 135 395 135 Q 380 135 380 150 Q 380 135 365 135 Q 380 135 380 120 Z" fill="#38bdf8" opacity="0.9"/>
  <path d="M 120 100 Q 120 110 130 110 Q 120 110 120 120 Q 120 110 110 110 Q 120 110 120 100 Z" fill="#ff4760" opacity="0.8"/>

  <!-- Character Group with Soft Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Body / Medical Scrubs Top -->
    <path d="M 175 560 L 175 430 Q 175 390 220 380 L 250 388 L 280 380 Q 325 390 325 430 L 325 560 Z" fill="#ffffff"/>

    <!-- Subtle Scrubs Shadow / Crease -->
    <path d="M 225 386 L 250 435 L 275 386" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <path d="M 215 440 L 215 560" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Stethoscope Around Neck: Decoderium Violet with Magenta Chest Bell -->
    <path d="M 220 385 Q 210 440 236 465 Q 250 480 264 465 Q 290 440 280 385" stroke="url(#decBrandGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="250" cy="475" r="8" fill="#94a3b8"/>
    <circle cx="250" cy="475" r="5" fill="#ff4760"/>

    <!-- Neck -->
    <rect x="235" y="340" width="30" height="45" rx="8" fill="#e5b899"/>
    <path d="M 235 365 Q 250 375 265 365 L 265 385 L 235 385 Z" fill="#d4a282" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="250" cy="300" rx="44" ry="50" fill="#f3c8ab"/>

    <!-- Ears -->
    <ellipse cx="204" cy="304" rx="8" ry="12" fill="#e5b899"/>
    <ellipse cx="296" cy="304" rx="8" ry="12" fill="#e5b899"/>

    <!-- Facial Details -->
    <ellipse cx="234" cy="298" rx="3.5" ry="4.5" fill="#0f172a"/>
    <ellipse cx="266" cy="298" rx="3.5" ry="4.5" fill="#0f172a"/>
    <circle cx="235.5" cy="296" r="1.2" fill="#ffffff"/>
    <circle cx="267.5" cy="296" r="1.2" fill="#ffffff"/>

    <path d="M 228 288 Q 235 285 242 288" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 258 288 Q 265 285 272 288" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

    <path d="M 250 298 L 248 308 L 253 308" stroke="#d4a282" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M 242 320 Q 250 327 258 320" stroke="#9c5c41" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <ellipse cx="226" cy="312" rx="5" ry="3" fill="#fca5a5" opacity="0.45"/>
    <ellipse cx="274" cy="312" rx="5" ry="3" fill="#fca5a5" opacity="0.45"/>

    <!-- Modern Dark Hair -->
    <path d="M 206 295 C 202 260 220 244 250 244 C 280 244 298 260 294 295 C 290 280 282 270 270 268 C 255 266 245 272 230 268 C 218 270 210 280 206 295 Z" fill="#0f172a"/>
    <path d="M 205 285 Q 218 268 238 270 Q 220 278 210 298 Z" fill="#1e293b"/>

    <!-- Decoderium Modern Headphones -->
    <path d="M 200 300 A 54 54 0 0 1 300 300" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#floatBadgeShadow)"/>
    <path d="M 200 300 A 54 54 0 0 1 300 300" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Left Earcup with Decoderium Violet Accent -->
    <rect x="194" y="290" width="12" height="28" rx="6" fill="#ffffff" filter="url(#floatBadgeShadow)"/>
    <rect x="197" y="294" width="6" height="20" rx="3" fill="#582be8"/>
    <!-- Right Earcup -->
    <rect x="294" y="290" width="12" height="28" rx="6" fill="#ffffff" filter="url(#floatBadgeShadow)"/>
    <rect x="297" y="294" width="6" height="20" rx="3" fill="#582be8"/>

    <!-- Arms & Hands Typing -->
    <path d="M 180 435 Q 165 470 200 500 L 225 490 Q 200 460 205 435 Z" fill="#ffffff"/>
    <path d="M 200 500 L 220 488" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="222" cy="495" rx="10" ry="8" fill="#f3c8ab"/>

    <path d="M 320 435 Q 335 470 300 500 L 275 490 Q 300 460 295 435 Z" fill="#ffffff"/>
    <path d="M 300 500 L 280 488" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="278" cy="495" rx="10" ry="8" fill="#f3c8ab"/>

    <!-- Modern Laptop Computer -->
    <path d="M 170 515 L 205 425 L 295 425 L 330 515 Z" fill="url(#laptopGrad)"/>
    <path d="M 178 510 L 210 432 L 290 432 L 322 510 Z" fill="url(#screenGlow)"/>

    <!-- Screen Heartbeat Wave in Decoderium Magenta/Violet -->
    <path d="M 218 472 L 236 472 L 242 455 L 248 485 L 254 466 L 260 472 L 282 472" stroke="url(#decPulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="225" y="482" width="50" height="4" rx="2" fill="#c4b5fd" opacity="0.6"/>
    <rect x="235" y="490" width="30" height="3" rx="1.5" fill="#cbd5e1" opacity="0.6"/>

    <!-- Laptop Base -->
    <path d="M 150 518 L 350 518 L 338 542 L 162 542 Z" fill="#cbd5e1"/>
    <rect x="175" y="520" width="150" height="12" rx="2" fill="#94a3b8" opacity="0.7"/>
    <rect x="232" y="534" width="36" height="6" rx="1.5" fill="#e2e8f0"/>
  </g>
</svg>