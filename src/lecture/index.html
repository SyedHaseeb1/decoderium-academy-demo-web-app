<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GILEAP Academy · Video Learning Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4760">
  <link rel="icon" type="image/svg+xml" href="../assets/decoderium-mark.svg">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/academy.css">
</head>
<body data-page="courses">
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <div class="main">
    <div id="app-header"></div>
    <div id="view"></div>
  </div>
</div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script src="../assets/boot.js"></script>
<script type="text/plain" data-src="ui.js"></script>
<script type="text/plain" data-src="rules.js"></script>
<script type="text/plain" data-src="access.js"></script>
<script type="text/plain" data-src="views.js"></script>
<script type="text/plain">
(function () {
  var params = new URLSearchParams(location.search);
  var isPreview = params.get('mode') === 'sandbox_preview' || params.get('eval_demo') === 'admin';
  if (!isPreview && !requireRole('doctor')) return;

  var d = me() || { id: 'preview-doc', name: 'Learner Preview' };
  var p = progressOf(d.id) || { watched: {}, quizzes: {}, certs: [] };

  var targetId = params.get('id');
  if (!targetId && params.get('c')) {
    var cTarget = (courses() || []).filter(function (x) { return x.id === params.get('c'); })[0];
    if (cTarget && cTarget.modules && cTarget.modules[0] && cTarget.modules[0].lectures && cTarget.modules[0].lectures[0]) {
      targetId = cTarget.modules[0].lectures[0].id;
    }
  }

  var f = findLecture(targetId);
  if (!f) {
    $('#view').innerHTML = '<div class="ui-card" style="text-align:center;padding:48px 20px;max-width:540px;margin:40px auto;border-radius:18px;"><i class="ms" style="font-size:48px;color:var(--slate);">search_off</i><h3 style="font-size:18px;font-weight:800;color:var(--navy);margin:12px 0 8px;">Lecture Not Found</h3><p style="font-size:13px;color:var(--slate);margin:0 0 20px;">The requested video lecture could not be loaded from the accredited catalog.</p><a href="../courses/" class="btn-pill-primary">Back to Courses</a></div>';
    return;
  }

  var c = f.course, m = f.module, l = f.lecture;
  var frac = (ACADEMY_DATA && ACADEMY_DATA.settings && ACADEMY_DATA.settings.lectureCompleteFraction) || 0.9;

  if (!isPreview && (!c.published || RULES.moduleState(c, m, p) === 'locked')) {
    snack('Pass the previous module’s quiz to unlock this lecture.');
    location.replace('../courses/#' + c.id);
    return;
  }

  var dur = l.seconds || 600;
  var max = RULES.watched(p, l.id);
  var pos = max >= dur ? 0 : max;
  var playing = false;
  var done = RULES.lectureDone(p, l.id);
  var lastSaved = max;
  var timer = null;

  var curLecIdx = m.lectures.findIndex(function (x) { return x.id === l.id; });
  if (curLecIdx === -1) curLecIdx = 0;
  var hasNextLec = (curLecIdx + 1 < m.lectures.length);
  var nextLec = hasNextLec ? m.lectures[curLecIdx + 1] : null;

  function pct() { return Math.min(100, Math.round(max * 100 / dur)); }

  function getUpNextData() {
    var isDone = done || RULES.lectureDone(p, l.id);
    var allLecturesDone = m.lectures.every(function (x) {
      return x.id === l.id ? isDone : RULES.lectureDone(p, x.id);
    });
    var quizDone = RULES.quizPassed(p, m.id);

    if (hasNextLec) {
      return {
        type: 'video',
        badge: 'Up Next · Lecture ' + (curLecIdx + 2),
        chipClass: 'adm-chip-violet',
        icon: 'play_circle',
        title: nextLec.title,
        meta: nextLec.presenter + ' · ' + fmtDur(nextLec.seconds),
        unlocked: isDone,
        url: '?id=' + nextLec.id + (isPreview ? '&mode=sandbox_preview' : ''),
        actionText: 'Watch Lecture ' + (curLecIdx + 2) + ' →',
        lockNote: 'Complete current lecture (90% watch threshold) to unlock.'
      };
    } else if (!quizDone) {
      return {
        type: 'quiz',
        badge: 'Module ' + m.number + ' Evaluation',
        chipClass: 'adm-chip-danger',
        icon: 'quiz',
        title: 'Module ' + m.number + ' PMDC Timed Accreditation Quiz',
        meta: '10 Clinical Questions · 10:00 Countdown · 70% Passing Gate',
        unlocked: allLecturesDone,
        url: '../quiz/?m=' + m.id,
        actionText: 'Start Timed Quiz →',
        lockNote: 'Complete all ' + m.lectures.length + ' module lectures to unlock evaluation.'
      };
    } else if (c.materials && c.materials.length) {
      var mat = c.materials[0];
      return {
        type: 'material',
        badge: 'Accredited Asset · ' + (mat.type || 'Guideline'),
        chipClass: 'adm-chip-cyan',
        icon: mat.fileName && mat.fileName.endsWith('.pptx') ? 'slideshow' : 'description',
        title: mat.title,
        meta: (mat.fileName || 'Clinical Document') + (mat.fileSize ? ' · ' + mat.fileSize : ''),
        unlocked: true,
        url: mat.url || '#',
        isExternal: true,
        actionText: 'Download Guideline ↗',
        lockNote: ''
      };
    } else {
      return {
        type: 'finish',
        badge: 'Module ' + m.number + ' Complete',
        chipClass: 'adm-chip-active',
        icon: 'verified',
        title: 'All Module ' + m.number + ' Requirements Satisfied',
        meta: 'Continuing Medical Education accredited units recorded.',
        unlocked: true,
        url: '../courses/#' + c.id,
        actionText: 'Return to Course Syllabus →',
        lockNote: ''
      };
    }
  }

  function renderUpNextBlockHtml() {
    var isDone = done || RULES.lectureDone(p, l.id);
    var u = getUpNextData();

    var actionHtml = '';
    if (u.unlocked) {
      actionHtml = '<a href="' + esc(u.url) + '" ' + (u.isExternal ? 'target="_blank" rel="noopener noreferrer"' : '') + ' class="btn-pill-primary" style="font-size:13px;padding:10px 22px;gap:8px;font-weight:700;display:inline-flex;align-items:center;text-decoration:none;box-shadow:0 4px 14px var(--primary-glow);white-space:nowrap;">' +
        '<i class="ms" style="font-size:16px;">' + (u.type === 'video' ? 'play_arrow' : (u.type === 'quiz' ? 'timer' : 'open_in_new')) + '</i> ' + esc(u.actionText) +
      '</a>';
    } else {
      actionHtml = '<button type="button" class="btn-pill-outline" onclick="snack(\'' + esc(u.lockNote) + '\');" style="font-size:12.5px;padding:10px 18px;gap:8px;font-weight:700;display:inline-flex;align-items:center;opacity:0.75;cursor:not-allowed;background:#f8fafc;border:1.5px dashed var(--line);white-space:nowrap;">' +
        '<i class="ms" style="font-size:16px;color:var(--slate);">lock</i> ' + (u.type === 'video' ? 'Locked (90% Watch Req.)' : 'Quiz Locked') +
      '</button>';
    }

    return '<div class="ui-card" style="margin-bottom:24px;padding:24px 26px;border-radius:20px;box-shadow:0 12px 32px -4px rgba(15,23,42,0.10),0 4px 12px -2px rgba(15,23,42,0.06);border:none;background:#ffffff;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:8px;">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span class="adm-chip adm-chip-violet" style="font-size:11px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;">Up Next in Curriculum</span>' +
          '<span style="font-size:13px;color:var(--slate);font-weight:600;">Module ' + m.number + ' Sequential Progression</span>' +
        '</div>' +
        '<div>' +
          (isDone ?
            '<span class="adm-chip adm-chip-active" style="font-size:11.5px;font-weight:700;padding:4px 10px;"><i class="ms" style="font-size:14px;">check_circle</i> Current Lecture Complete (90%+)</span>' :
            '<span class="adm-chip adm-chip-warn" style="font-size:11.5px;font-weight:700;padding:4px 10px;"><i class="ms" style="font-size:14px;">schedule</i> ' + pct() + '% Watched · 90% Required</span>') +
        '</div>' +
      '</div>' +

      '<!-- Hero Up Next Item -->' +
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:14px;background:' + (u.unlocked ? '#f0fdf4;border:1.5px solid #86efac;' : '#f8fafc;border:1.5px solid #e2e8f0;') + ';gap:16px;flex-wrap:wrap;margin-bottom:20px;">' +
        '<div style="display:flex;align-items:center;gap:14px;min-width:0;flex:1;">' +
          '<div style="width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:' + (u.unlocked ? '#dcfce7;color:#15803d;' : '#f1f5f9;color:#64748b;') + ';">' +
            '<i class="ms" style="font-size:26px;">' + u.icon + '</i>' +
          '</div>' +
          '<div style="min-width:0;">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">' +
              '<span class="adm-chip ' + u.chipClass + '" style="font-size:10px;font-weight:800;">' + u.badge + '</span>' +
              '<span style="font-size:11px;color:var(--slate);">' + esc(u.meta) + '</span>' +
            '</div>' +
            '<h3 style="margin:0;font-size:15.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(u.title) + '</h3>' +
          '</div>' +
        '</div>' +
        '<div>' + actionHtml + '</div>' +
      '</div>' +

      '<!-- Sequential Module Items Track -->' +
      '<div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
          '<strong style="font-size:13px;color:var(--navy);">Module ' + m.number + ' Sequential Content & Materials</strong>' +
          '<span style="font-size:11.5px;color:var(--slate);">' + (curLecIdx + (isDone ? 1 : 0)) + ' of ' + m.lectures.length + ' Lectures Completed</span>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px;">' +
          renderSequentialTimelineHtml() +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderSequentialTimelineHtml() {
    var isDone = done || RULES.lectureDone(p, l.id);
    var allPrevDone = true;

    var items = m.lectures.map(function (lec, idx) {
      var isCur = (lec.id === l.id);
      var lDone = isCur ? isDone : RULES.lectureDone(p, lec.id);
      var accessible = isCur || lDone || (idx === curLecIdx + 1 && isDone) || (idx === 0);

      var rowHtml = '';
      if (isCur) {
        rowHtml = '<div style="background:var(--primary);color:#ffffff;padding:12px 18px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px var(--primary-glow);">' +
          '<div style="display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;"><i class="ms" style="font-size:20px;">smart_display</i><span>Lecture ' + (idx + 1) + ': ' + esc(lec.title) + '</span></div>' +
          '<span style="font-size:11.5px;font-weight:700;background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:999px;">' + (isDone ? '✓ Completed' : 'Now Playing · ' + pct() + '%') + '</span>' +
        '</div>';
      } else if (lDone) {
        rowHtml = '<a href="?id=' + lec.id + (isPreview ? '&mode=sandbox_preview' : '') + '" style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#ffffff;border:1px solid #e2e8f0;text-decoration:none;color:var(--navy);font-size:13px;font-weight:600;transition:all 0.15s ease;">' +
          '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:20px;color:var(--emerald);">check_circle</i><span>Lecture ' + (idx + 1) + ': ' + esc(lec.title) + '</span></div>' +
          '<span style="font-size:11.5px;color:var(--emerald);font-weight:700;">Completed ✓</span>' +
        '</a>';
      } else if (accessible) {
        rowHtml = '<a href="?id=' + lec.id + (isPreview ? '&mode=sandbox_preview' : '') + '" style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#f8fafc;border:1.5px solid #818cf8;text-decoration:none;color:var(--navy);font-size:13px;font-weight:700;transition:all 0.15s ease;">' +
          '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:20px;color:var(--primary);">play_circle</i><span>Lecture ' + (idx + 1) + ': ' + esc(lec.title) + '</span></div>' +
          '<span style="font-size:11.5px;color:var(--primary);font-weight:700;">Ready to Watch →</span>' +
        '</a>';
      } else {
        rowHtml = '<div onclick="snack(\'Locked: Complete Lecture ' + idx + ' (90% watch velocity) to unlock.\');" style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#f8fafc;border:1px dashed #e2e8f0;color:#94a3b8;font-size:13px;font-weight:600;cursor:not-allowed;opacity:0.8;">' +
          '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:18px;color:#94a3b8;">lock</i><span>Lecture ' + (idx + 1) + ': ' + esc(lec.title) + '</span></div>' +
          '<span style="font-size:11px;color:#94a3b8;">Locked</span>' +
        '</div>';
      }
      return rowHtml;
    });

    // Add Module Timed Quiz row
    var allLecsDone = m.lectures.every(function (x) { return x.id === l.id ? isDone : RULES.lectureDone(p, x.id); });
    var qPassed = RULES.quizPassed(p, m.id);
    var quizRow = '';
    if (qPassed) {
      quizRow = '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:13px;font-weight:700;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:20px;color:#059669;">verified</i><span>Module ' + m.number + ' Timed Evaluation: PMDC Clinical Quiz</span></div>' +
        '<span style="font-size:11.5px;color:#059669;font-weight:800;">Passed (100% Score) ✓</span>' +
      '</div>';
    } else if (allLecsDone) {
      quizRow = '<a href="../quiz/?m=' + m.id + '" style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#fff1f2;border:1.5px solid #fecdd3;color:#be123c;text-decoration:none;font-size:13px;font-weight:700;transition:all 0.15s ease;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:20px;color:#e11d48;">quiz</i><span>Module ' + m.number + ' Timed Evaluation: PMDC Clinical Quiz</span></div>' +
        '<span style="font-size:11.5px;color:#e11d48;font-weight:800;">Unlocked · Begin Quiz →</span>' +
      '</a>';
    } else {
      quizRow = '<div onclick="snack(\'Locked: Complete all lectures in Module ' + m.number + ' to unlock timed quiz.\');" style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-radius:12px;background:#f8fafc;border:1px dashed #e2e8f0;color:#94a3b8;font-size:13px;font-weight:600;cursor:not-allowed;opacity:0.8;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:18px;color:#94a3b8;">lock</i><span>Module ' + m.number + ' Timed Evaluation: PMDC Clinical Quiz</span></div>' +
        '<span style="font-size:11px;color:#94a3b8;">Locked (Watch all lectures)</span>' +
      '</div>';
    }
    items.push(quizRow);

    // Add Course Materials rows if any
    if (c.materials && c.materials.length) {
      c.materials.forEach(function (mat) {
        var isPpt = mat.fileName && mat.fileName.endsWith('.pptx');
        items.push(
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-radius:12px;background:#f0f9ff;border:1px solid #bae6fd;font-size:12.5px;">' +
            '<div style="display:flex;align-items:center;gap:10px;"><i class="ms" style="font-size:19px;color:#0284c7;">' + (isPpt ? 'slideshow' : 'description') + '</i><div><strong style="color:var(--navy);">' + esc(mat.title) + '</strong><span style="font-size:11px;color:var(--slate);margin-left:6px;">' + (mat.fileSize ? ' · ' + esc(mat.fileSize) : '') + '</span></div></div>' +
            '<a href="' + esc(mat.url || '#') + '" target="_blank" rel="noopener noreferrer" class="btn-pill-outline" style="font-size:11px;padding:4px 12px;text-decoration:none;background:#ffffff;"><i class="ms" style="font-size:13px;vertical-align:-2px;">open_in_new</i> View</a>' +
          '</div>'
        );
      });
    }

    return items.join('');
  }

  // Initial layout rendering
  var initialVideoUrl = l.videoUrl || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';

  var html =
    '<div class="lecture-page-wrap" style="max-width:960px;margin:0 auto;padding:16px 16px 64px;">' +
      crumbs([{ label: 'Courses', href: '../courses/' }, { label: c.title, href: '../courses/#' + c.id }, { label: 'Module ' + m.number }]) +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0 16px;">' +
        '<div>' +
          '<h1 style="font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px;letter-spacing:-0.4px;">' + esc(l.title) + '</h1>' +
          '<div style="font-size:13px;color:var(--slate);display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
            '<span><strong>' + esc(l.presenter) + '</strong> · Module ' + m.number + ': ' + esc(m.title) + '</span>' +
            '<span class="ui-badge-pill primary" style="font-size:10px;padding:2px 8px;">PMDC Accredited</span>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<a href="../courses/#' + c.id + '" class="btn-pill-outline" style="font-size:12px;min-height:38px;display:inline-flex;align-items:center;padding:6px 14px;box-sizing:border-box;"><i class="ms">menu_book</i> Syllabus</a>' +
        '</div>' +
      '</div>' +

      '<!-- ELEGANT 16:9 VIDEO PLAYER VIEWPORT -->' +
      '<div class="player-container" id="playerWrap" style="max-width:960px;width:100%;margin:0 auto 20px;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px -8px rgba(15,23,42,0.22);background:#0b0f17;">' +
        '<div class="player-screen" style="position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;">' +
          '<video id="lectureVid" class="player-video" src="' + esc(initialVideoUrl) + '" playsinline preload="auto" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>' +
          '<div style="position:absolute;top:14px;left:14px;background:rgba(17,24,39,0.78);backdrop-filter:blur(6px);color:#fff;padding:4px 12px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700;z-index:2;pointer-events:none;">' +
            '<i class="ms" style="font-size:14px;vertical-align:-2px;">visibility</i> 842 Doctors Enrolled' +
          '</div>' +
          '<span id="chip" style="position:absolute;top:14px;right:14px;background:rgba(17,24,39,0.78);backdrop-filter:blur(6px);color:#fff;padding:4px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,0.18);z-index:2;pointer-events:none;"></span>' +
          '<button class="player-big-btn" id="big" type="button" aria-label="Play lecture" style="z-index:3;"><i class="ms">play_arrow</i></button>' +
        '</div>' +

        '<div class="player-controls-bar">' +
          '<button class="player-ctl-btn" id="tog" type="button" aria-label="Play / Pause"><i class="ms">play_arrow</i></button>' +
          '<button class="player-ctl-btn" id="rewind10" type="button" aria-label="Rewind 10 seconds" title="Rewind 10s"><i class="ms">replay_10</i></button>' +
          '<button class="player-ctl-btn" id="forward10" type="button" aria-label="Forward 10 seconds" title="Forward 10s"><i class="ms">forward_10</i></button>' +
          '<span class="player-timer-lbl" id="time">00:00 / 00:00</span>' +
          '<input class="player-timeline-bar" id="seek" type="range" min="0" max="' + dur + '" value="0" aria-label="Seek">' +
          '<button class="btn" id="spd" type="button" style="border-radius:var(--radius-pill);padding:6px 14px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;background:rgba(255,255,255,0.14);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:700;" title="Toggle Playback Speed">1× Speed</button>' +
          '<button class="player-ctl-btn" id="fsBtn" type="button" aria-label="Fullscreen" title="Toggle Fullscreen"><i class="ms">fullscreen</i></button>' +
        '</div>' +

        '<div class="player-watch-meter" id="watchMeter">' +
          '<span><i class="ms" style="font-size:16px;vertical-align:-2px;">verified</i> 90% Watch Threshold Required for Next Content</span>' +
          '<strong id="watchMeterStatus">0%</strong>' +
        '</div>' +
      '</div>' +

      '<!-- SEQUENTIAL UP NEXT PROGRESSION BLOCK (DIRECTLY BELOW VIDEO) -->' +
      '<div id="upNextWrap">' +
        renderUpNextBlockHtml() +
      '</div>' +

      '<!-- ABOUT & CLINICAL KEY TAKEAWAYS (CLEAN & UNCLUTTERED) -->' +
      '<div class="ui-card" style="padding:24px;border-radius:18px;box-shadow:0 10px 30px -4px rgba(15,23,42,0.06);border:none;background:#ffffff;">' +
        '<h3 style="font-size:16px;font-weight:800;color:var(--navy);margin:0 0 10px;">About This Clinical Masterclass</h3>' +
        '<p style="font-size:13.5px;color:var(--slate-dark);line-height:1.6;margin:0 0 16px;">' + esc(l.summary) + '</p>' +
        '<div style="background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:18px;">' +
          '<i class="ms" style="color:var(--primary);font-size:20px;">verified</i>' +
          '<span style="font-size:12.5px;color:var(--navy);">Mandatory completion threshold: This lecture completes automatically once watched to <strong>' + Math.round(frac * 100) + '%</strong> duration. Forward scrubbing is guarded.</span>' +
        '</div>' +
        '<h4 style="font-size:14px;font-weight:800;color:var(--navy);margin:0 0 10px;">Clinical Key Takeaways</h4>' +
        '<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--slate-dark);display:flex;flex-direction:column;gap:8px;line-height:1.5;">' +
          '<li>Montreal criteria for GERD: heartburn and acid regurgitation; distinguish erosive vs non-erosive reflux disease (NERD).</li>' +
          '<li>Optimize acid suppression with PPIs or P-CABs (Vonoprazan) for meal-independent, 24-hour pH control.</li>' +
          '<li>Screen for alarm features (dysphagia, weight loss, anemia) and follow Los Angeles classification (LA Grade A-D).</li>' +
        '</ul>' +
      '</div>' +
    '</div>';

  $('#view').innerHTML = html;

  var speedRates = [1, 1.25, 1.5, 2, 8];
  var speedLabels = ['1× Speed', '1.25× Speed', '1.5× Speed', '2× Speed', '8× Fast Sim'];
  var currentSpeedIdx = 0;

  function paint() {
    $('#time').textContent = fmtClock(pos) + ' / ' + fmtClock(dur);
    $('#seek').value = Math.floor(pos);
    var chip = $('#chip');
    if (chip) {
      chip.textContent = done ? '✓ 90% Watched' : pct() + '% watched';
      chip.style.borderColor = done ? 'var(--emerald)' : 'rgba(255,255,255,0.18)';
      chip.style.color = done ? '#a7f3d0' : '#fff';
    }
    $('#tog .ms').textContent = playing ? 'pause' : 'play_arrow';
    $('#big').style.display = playing ? 'none' : 'grid';
    $('#spd').textContent = speedLabels[currentSpeedIdx];

    var wm = $('#watchMeter'), wms = $('#watchMeterStatus');
    if (wm && wms) {
      if (done) {
        wm.className = 'player-watch-meter unlocked';
        wms.textContent = '✓ Threshold Reached (Next Unlocked)';
      } else {
        wm.className = 'player-watch-meter';
        wms.textContent = pct() + '% / 90%';
      }
    }

    var upWrap = $('#upNextWrap');
    if (upWrap) {
      upWrap.innerHTML = renderUpNextBlockHtml();
    }
  }

  var vid = $('#lectureVid');
  var isSimulating = false;

  function save() {
    lastSaved = max;
    recordWatch(l.id, max);
  }

  function stop() {
    playing = false;
    clearInterval(timer);
    timer = null;
    if (vid && !vid.paused) vid.pause();
  }

  function checkCompletion() {
    var just = !done && RULES.lectureComplete(max, dur, frac);
    if (just || Math.floor(pos) - lastSaved >= 5 || pos >= dur) save();
    if (just) {
      done = true;
      snack('✓ Lecture complete (90% threshold reached). Next material unlocked!');
      if (typeof sideAlert === 'function') {
        sideAlert('Lecture Threshold Passed (90%)', 'Module lecture marked complete. Up next item unlocked!', 'success');
      }
      paint();
    }
  }

  function tick() {
    if (isSimulating) {
      pos = Math.min(dur, pos + 0.2 * 8);
      max = Math.max(max, Math.floor(pos));
      if (vid && !isNaN(vid.duration) && vid.duration > 0) {
        try { vid.currentTime = Math.min(vid.duration, pos); } catch (e) {}
      }
      checkCompletion();
      if (pos >= dur) {
        stop();
        save();
      }
      paint();
    }
  }

  function toggle() {
    if (playing) {
      stop();
      save();
      paint();
      return;
    }
    if (pos >= dur) pos = 0;
    playing = true;
    if (isSimulating) {
      timer = setInterval(tick, 200);
    } else if (vid) {
      if (Math.abs((vid.currentTime || 0) - pos) > 1) {
        vid.currentTime = Math.min(vid.duration || dur, pos);
      }
      vid.play().then(function () {
        playing = true;
        paint();
      }).catch(function (err) {
        isSimulating = true;
        timer = setInterval(tick, 200);
        paint();
      });
    }
    paint();
  }

  if (vid) {
    var screenEl = vid.parentElement;
    if (screenEl) {
      screenEl.addEventListener('click', function (e) {
        if (e.target.closest('#big') || e.target === vid || e.target === screenEl) {
          toggle();
        }
      });
    }

    vid.addEventListener('play', function () {
      playing = true;
      paint();
    });

    vid.addEventListener('pause', function () {
      if (!isSimulating) {
        playing = false;
        paint();
      }
    });

    vid.addEventListener('timeupdate', function () {
      if (!isSimulating && playing) {
        pos = Math.min(dur, vid.currentTime);
        max = Math.max(max, Math.floor(pos));
        checkCompletion();
        paint();
      }
    });

    vid.addEventListener('ended', function () {
      pos = dur;
      max = dur;
      done = true;
      stop();
      save();
      snack('✓ Lecture complete (100% finished). Next material unlocked!');
      paint();
    });

    vid.addEventListener('seeking', function () {
      if (!done && vid.currentTime > max + 2) {
        vid.currentTime = max;
        pos = max;
        snack('Forward scrubbing is locked. Complete sequentially to reach 90% threshold.');
      }
    });
  }

  $('#big').onclick = toggle;
  $('#tog').onclick = toggle;

  var r10 = $('#rewind10');
  if (r10) r10.onclick = function () {
    pos = Math.max(0, pos - 10);
    if (vid) vid.currentTime = pos;
    paint();
  };

  var f10 = $('#forward10');
  if (f10) f10.onclick = function () {
    pos = Math.min(max, pos + 10);
    if (vid) vid.currentTime = pos;
    paint();
  };

  var fs = $('#fsBtn'), pw = $('#playerWrap');
  if (fs && pw) {
    fs.onclick = function () {
      if (!document.fullscreenElement) {
        if (pw.requestFullscreen) pw.requestFullscreen();
        else if (pw.webkitRequestFullscreen) pw.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };
  }

  $('#spd').onclick = function () {
    currentSpeedIdx = (currentSpeedIdx + 1) % speedRates.length;
    var targetRate = speedRates[currentSpeedIdx];
    this.textContent = speedLabels[currentSpeedIdx];
    this.style.background = currentSpeedIdx > 0 ? 'var(--primary)' : 'rgba(255,255,255,0.14)';

    if (targetRate <= 2) {
      isSimulating = false;
      clearInterval(timer);
      timer = null;
      if (vid) {
        vid.playbackRate = targetRate;
        if (playing && vid.paused) {
          vid.play().catch(function () {});
        }
      }
    } else {
      isSimulating = true;
      clearInterval(timer);
      if (vid && !vid.paused) vid.pause();
      if (playing) {
        timer = setInterval(tick, 200);
      }
    }
    paint();
  };

  $('#seek').oninput = function () {
    var target = parseInt(this.value, 10) || 0;
    if (target > max && !done) {
      this.value = Math.floor(pos);
      snack('Forward scrubbing is locked until 90% completion.');
      return;
    }
    pos = target;
    if (vid && !isNaN(vid.duration)) vid.currentTime = target;
    paint();
  };

  window.addEventListener('pagehide', function () { if (max > lastSaved) save(); });

  paint();
})();
</script>
<script type="text/plain" data-src="header.js"></script>
<script type="text/plain" data-src="nav.js"></script>
</body>
