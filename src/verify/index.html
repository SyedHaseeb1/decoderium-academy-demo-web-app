<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decoderium Academy · Public Certificate Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4760">
  <link rel="icon" type="image/svg+xml" href="../assets/decoderium-mark.svg">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/academy.css">
</head>
<body class="verify-modern-page" style="background:var(--bg)!important;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;box-sizing:border-box;">

<div class="verify-canvas-card">
  <div style="width:52px;height:52px;border-radius:var(--radius-md);background:linear-gradient(135deg,#ff4760,#e60057);color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 16px;box-shadow:var(--shadow-glow);">
    <i class="ms">verified</i>
  </div>

  <h1 style="font-size:24px;font-weight:800;color:var(--navy);margin:0 0 6px;">PMDC Certificate Verification</h1>
  <p style="font-size:13.5px;color:var(--slate);line-height:1.5;margin:0;">Instant public verification portal for hospitals, medical councils, and regulatory authorities.</p>

  <form id="f" class="verify-search-box" novalidate>
    <i class="ms" style="color:var(--slate);font-size:18px;">qr_code_scanner</i>
    <input id="code" placeholder="Enter Certificate Code (e.g. SHA-2026-WQDJNV)" aria-label="Certificate number" autocomplete="off" maxlength="30" value="SHA-2026-WQDJNV">
    <button class="btn-premium-pill" type="submit" style="padding:10px 22px;">Verify</button>
  </form>

  <div id="out" role="status"></div>

  <div style="margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--slate);">
    <span>Decoderium Academy Registry</span>
    <a href="../login/" style="color:var(--navy);font-weight:700;text-decoration:none;">Sign in to Doctor Portal &rarr;</a>
  </div>
</div>

<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script src="../assets/boot.js"></script>
<script type="text/plain" data-src="ui.js"></script>
<script type="text/plain" data-src="rules.js"></script>
<script type="text/plain" data-src="access.js"></script>
<script type="text/plain">
(function () {
  function check() {
    var code = $('#code').value.trim(), out = $('#out');
    if (!code) { out.innerHTML = ''; return; }
    var r = verifyCert(code);
    out.innerHTML = r
      ? '<div style="background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:var(--radius-lg);padding:22px;text-align:left;box-shadow:var(--shadow-sm);">' +
          '<div style="display:flex;align-items:center;gap:10px;color:#065f46;font-size:16px;font-weight:800;margin-bottom:12px;">' +
            '<i class="ms" style="font-size:22px;">verified</i> Official Valid Credential' +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr;gap:8px;font-size:13.5px;color:#1e293b;">' +
            '<div><span style="color:#64748b;font-weight:600;">Physician Name:</span> <strong>' + esc(r.doctor.name) + '</strong></div>' +
            '<div><span style="color:#64748b;font-weight:600;">PMDC ID:</span> <strong>' + esc(r.doctor.pmdcId) + '</strong></div>' +
            '<div><span style="color:#64748b;font-weight:600;">Speciality & Center:</span> ' + esc(r.doctor.speciality + ' · ' + r.doctor.hospital + ', ' + r.doctor.city) + '</div>' +
            '<div><span style="color:#64748b;font-weight:600;">Course Curriculum:</span> <strong>' + esc(r.course.title) + '</strong></div>' +
            '<div><span style="color:#64748b;font-weight:600;">Date of Certification:</span> ' + fmtDate(r.cert.issuedOn) + '</div>' +
          '</div>' +
        '</div>'
      : '<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:var(--radius-lg);padding:18px;color:#991b1b;font-size:13px;font-weight:600;" role="alert"><i class="ms" style="vertical-align:-3px;">cancel</i> No official certificate found for code: “' + esc(code) + '”. Please re-check the number.</div>';
  }

  $('#f').addEventListener('submit', function (e) { e.preventDefault(); check(); });
  var pre = new URLSearchParams(location.search).get('code');
  if (pre) { $('#code').value = pre; check(); }
  else { check(); }
})();
</script>
</body>
</html>
